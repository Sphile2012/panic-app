



















name: panic-ring

x-healthcheck-defaults: &hc
  interval: 10s
  timeout:  5s
  retries:  5

services:



  db:
    image: supabase/postgres:15.1.1.78
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_HOST:     /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
      JWT_SECRET:        ${JWT_SECRET}
      ROLE_SYSTEM_USER:  supabase_admin
    volumes:
      - db_data:/var/lib/postgresql/data

      - ./supabase/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]



  vector:
    image: timberio/vector:0.28.1-alpine
    restart: unless-stopped
    volumes:
      - ./supabase/vector.yml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]



  auth:
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST:                    0.0.0.0
      GOTRUE_API_PORT:                    9999
      API_EXTERNAL_URL:                   ${API_URL}
      GOTRUE_DB_DRIVER:                   postgres
      GOTRUE_DB_DATABASE_URL:             postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL:                    ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST:              "${ADDITIONAL_REDIRECT_URLS:-}"
      GOTRUE_JWT_SECRET:                  ${JWT_SECRET}
      GOTRUE_JWT_EXP:                     3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME:      authenticated
      GOTRUE_DISABLE_SIGNUP:              "false"
      GOTRUE_MAILER_AUTOCONFIRM:          "${GOTRUE_MAILER_AUTOCONFIRM:-true}"
      GOTRUE_SMTP_HOST:                   ${SMTP_HOST:-""}
      GOTRUE_SMTP_PORT:                   ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER:                   ${SMTP_USER:-""}
      GOTRUE_SMTP_PASS:                   ${SMTP_PASS:-""}
      GOTRUE_SMTP_ADMIN_EMAIL:            ${SMTP_ADMIN_EMAIL:-no-reply@panicring.local}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirm your Panic Ring account"
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]



  rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI:               postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS:           public,storage,graphql_public
      PGRST_DB_ANON_ROLE:         anon
      PGRST_JWT_SECRET:           ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS:   "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]



  realtime:
    image: supabase/realtime:v2.28.32
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:           4000
      DB_HOST:        db
      DB_PORT:        5432
      DB_USER:        supabase_admin
      DB_PASSWORD:    ${POSTGRES_PASSWORD}
      DB_NAME:        postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY:     supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID:   local
      FLY_APP_NAME:   realtime
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS:     -proto_dist inet_tcp
      DNS_NODES:      "''"
      RLIMIT_NOFILE:  "10000"
    command: >
      sh -c "/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server"



  storage:
    image: supabase/storage-api:v1.0.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY:                  ${ANON_KEY}
      SERVICE_KEY:               ${SERVICE_ROLE_KEY}
      POSTGREST_URL:             http://rest:3000
      PGRST_JWT_SECRET:          ${JWT_SECRET}
      DATABASE_URL:              postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT:           52428800
      STORAGE_BACKEND:           file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID:                 stub
      REGION:                    stub
      GLOBAL_S3_BUCKET:          stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL:              http://imgproxy:5001
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]



  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND:            ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG:        "true"
    volumes:
      - storage_data:/var/lib/storage:ro



  meta:
    image: supabase/postgres-meta:v0.83.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT:     8080
      PG_META_DB_HOST:  db
      PG_META_DB_PORT:  5432
      PG_META_DB_NAME:  postgres
      PG_META_DB_USER:  supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}



  studio:
    image: supabase/studio:20240326-5e5586d
    restart: unless-stopped
    depends_on:
      - kong
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      STUDIO_PG_META_URL:           http://meta:8080
      POSTGRES_PASSWORD:            ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME:    Panic Ring
      DEFAULT_PROJECT_NAME:         panic-ring
      SUPABASE_URL:                 http://kong:8000
      SUPABASE_PUBLIC_URL:          ${API_URL}
      SUPABASE_ANON_KEY:            ${ANON_KEY}
      SUPABASE_SERVICE_KEY:         ${SERVICE_ROLE_KEY}
    healthcheck:
      <<: *hc
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/profile', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]



  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # Place a TLS-terminating proxy in front for production.
      - "127.0.0.1:8443:8443"
    environment:
      KONG_DATABASE:         "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER:        LAST,A,CNAME
      KONG_PLUGINS:          request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE:    160k
      KONG_NGINX_PROXY_PROXY_BUFFERS:        "64 160k"
      SUPABASE_ANON_KEY:     ${ANON_KEY}
      SUPABASE_SERVICE_KEY:  ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME:    ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD:    ${DASHBOARD_PASSWORD:-changeme}
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    command: ["kong", "docker-start"]
    healthcheck:
      <<: *hc
      test: ["CMD", "kong", "health"]



  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL:      ${API_URL}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]

volumes:
  db_data:
  storage_data:
