# Minimal Vector config required by Supabase Studio.
# Collects Docker container logs and exposes them via HTTP.

api:
  enabled: true
  address: "0.0.0.0:9001"

sources:
  docker_host:
    type: docker_logs
    exclude_containers: []

sinks:
  stdout:
    type:   console
    inputs: [docker_host]
    encoding:
      codec: json
