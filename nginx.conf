###############################################################################
#  Panic Ring — Nginx configuration (production)
#
#  Routes
#  ------
#  /                 → dist/index.html  (main app)
#  /dashboard.html   → dist/dashboard.html
#  /health           → 200 OK  (Docker healthcheck)
#  /api/*            → Kong:8000  (server-side Supabase proxy)
#  /api/what3words   → what3words (server-side key)
###############################################################################

map $http_authorization $supabase_authorization {
    default $http_authorization;
    "Bearer panic-ring-public-proxy-key" "Bearer ${SUPABASE_ANON_KEY}";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── MIME types ────────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  json;
        application/javascript     js mjs;
    }
    default_type application/octet-stream;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # X-Frame-Options: prevent clickjacking
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;

    # Permissions: only allow geolocation for the app itself (SMS is device-native)
    add_header Permissions-Policy  "geolocation=(self), camera=(), microphone=(), usb=()" always;

    # Service worker scope
    add_header Service-Worker-Allowed  "/"  always;

    # Content-Security-Policy
    # - default-src 'self'
    # - scripts: self + inline (Vite injects a small inline boot)
    # - connect-src: same-origin APIs + Nominatim
    # - img-src: self + data: (base64 photo backgrounds)
    # - frame-ancestors: none (no embedding)
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         connect-src 'self' https://nominatim.openstreetmap.org; \
         img-src 'self' data: https:; \
         font-src 'self' data:; \
         manifest-src 'self'; \
         worker-src 'self'; \
         frame-ancestors 'none';"
        always;

    # HSTS — enable only if TLS is terminated upstream
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Docker / load-balancer healthcheck ───────────────────────────────────
    location = /health {
        access_log  off;
        add_header  Content-Type text/plain;
        return 200  "ok";
    }

    # ── Static assets (hashed filenames) — immutable long-term cache ─────────
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Service worker — never cached ─────────────────────────────────────────
    location = /sw.js {
        add_header  Cache-Control "no-cache, no-store, must-revalidate";
        expires     off;
    }

    # ── Web app manifest ──────────────────────────────────────────────────────
    location = /manifest.json {
        add_header  Cache-Control "no-cache, must-revalidate";
        expires     0;
    }

    # ── Server-side what3words proxy ──────────────────────────────────────────
    location = /api/what3words {
        proxy_pass            https://api.what3words.com/v3/convert-to-3wa?$args&key=${WHAT3WORDS_API_KEY};
        proxy_ssl_server_name on;
        proxy_set_header      Host api.what3words.com;
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    # ── Same-origin Supabase auth and PostgREST proxy ──────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass             http://kong:8000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       apikey            ${SUPABASE_ANON_KEY};
        proxy_set_header       Authorization     $supabase_authorization;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
    }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    location = /dashboard.html {
        try_files /dashboard.html =404;
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
