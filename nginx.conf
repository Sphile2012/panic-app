###############################################################################
#  Panic Ring — Nginx configuration (production)
#
#  Routes
#  ------
#  /                 → dist/index.html  (main app)
#  /dashboard.html   → dist/dashboard.html
#  /health           → 200 OK  (Docker healthcheck)
#  /rest/v1/*        → Kong:8000  (PostgREST)
#  /auth/v1/*        → Kong:8000  (GoTrue)
#  /storage/v1/*     → Kong:8000  (Supabase Storage)
#  /realtime/*       → Kong:8000  (Realtime WebSocket)
###############################################################################

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── MIME types ────────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  json;
        application/javascript     js mjs;
    }
    default_type application/octet-stream;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # X-Frame-Options: prevent clickjacking
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;

    # Permissions: only allow geolocation for the app itself (SMS is device-native)
    add_header Permissions-Policy  "geolocation=(self), camera=(), microphone=(), usb=()" always;

    # Service worker scope
    add_header Service-Worker-Allowed  "/"  always;

    # Content-Security-Policy
    # - default-src 'self'
    # - scripts: self + inline (Vite injects a small inline boot)
    # - connect-src: self + Supabase + Nominatim + what3words + google maps
    # - img-src: self + data: (base64 photo backgrounds)
    # - frame-ancestors: none (no embedding)
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org https://api.what3words.com https://maps.googleapis.com; \
         img-src 'self' data: https:; \
         font-src 'self' data:; \
         manifest-src 'self'; \
         worker-src 'self'; \
         frame-ancestors 'none';"
        always;

    # HSTS — enable only if TLS is terminated upstream
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Docker / load-balancer healthcheck ───────────────────────────────────
    location = /health {
        access_log  off;
        add_header  Content-Type text/plain;
        return 200  "ok";
    }

    # ── Static assets (hashed filenames) — immutable long-term cache ─────────
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Service worker — never cached ─────────────────────────────────────────
    location = /sw.js {
        add_header  Cache-Control "no-cache, no-store, must-revalidate";
        expires     off;
    }

    # ── Web app manifest ──────────────────────────────────────────────────────
    location = /manifest.json {
        add_header  Cache-Control "no-cache, must-revalidate";
        expires     0;
    }

    # ── Supabase REST ─────────────────────────────────────────────────────────
    location /rest/v1/ {
        proxy_pass             http://kong:8000/rest/v1/;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
    }

    # ── Supabase Auth ─────────────────────────────────────────────────────────
    location /auth/v1/ {
        proxy_pass            http://kong:8000/auth/v1/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # ── Supabase Storage ──────────────────────────────────────────────────────
    location /storage/v1/ {
        proxy_pass            http://kong:8000/storage/v1/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        client_max_body_size  50m;
    }

    # ── Supabase Realtime WebSocket ───────────────────────────────────────────
    location /realtime/ {
        proxy_pass            http://kong:8000/realtime/;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      Host       $host;
        proxy_read_timeout    3600s;
    }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    location = /dashboard.html {
        try_files /dashboard.html =404;
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
